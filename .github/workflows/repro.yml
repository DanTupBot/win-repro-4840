name: Repro Dart-Code 4840

on:
  push:
  workflow_dispatch:

jobs:
  repro:
    name: MSYS2 ${{ matrix.tag }} (${{ matrix.label }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: "2024-05-07"
            date: "20240507"
            label: "msys2-runtime 3.5.3-2, pre-Sep-2024"
          - tag: "2024-07-27"
            date: "20240727"
            label: "msys2-runtime 3.5.3-5, pre-Sep-2024"
          - tag: "2024-11-16"
            date: "20241116"
            label: "msys2-runtime 3.5.4-5, post-Sep-2024 3.5.x"
          - tag: "2025-02-21"
            date: "20250221"
            label: "msys2-runtime 3.5.7-2, post-Sep-2024 3.5.x"
          - tag: "2026-11-20"
            date: "20261120"
            label: "msys2-runtime 3.6.12-1, latest 3.6.x"
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Download and extract MSYS2 ${{ matrix.tag }}
        shell: pwsh
        run: |
          $url = "https://github.com/msys2/msys2-installer/releases/download/${{ matrix.tag }}/msys2-base-x86_64-${{ matrix.date }}.tar.xz"
          Write-Host "Downloading $url"
          curl.exe -fsSL -o msys2.tar.xz $url
          New-Item -ItemType Directory -Force -Path C:\msys2-test | Out-Null
          7z x msys2.tar.xz -y | Out-Null
          7z x msys2.tar -oC:\msys2-test -aoa -y | Out-Null
          Write-Host "=== Environment ==="
          & C:\msys2-test\msys64\usr\bin\uname.exe -a
          node -v
          dart --version
          git --version
      - name: Run repro scenarios
        shell: pwsh
        run: node run_tests.js C:\msys2-test\msys64
